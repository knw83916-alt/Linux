
name: Extract ZIP

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/extract-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          for archive in Path(".").rglob("*.zip"):
              if ".git" in archive.parts:
                  continue

              target = archive.parent / archive.stem
              target.mkdir(parents=True, exist_ok=True)

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      path = Path(item.filename)
                      if path.is_absolute() or ".." in path.parts:
                          raise ValueError(
                              f"Unsafe ZIP path: {item.filename}"
                          )
                      if item.filename:
                          z.extract(item, target)

              print(f"Extracted: {archive} -> {target}")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Extract uploaded ZIP files"
            git push
          fi
          
