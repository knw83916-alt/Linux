
name: Extract ZIP in Same Folder

on:
  push:
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/extract-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP beside archive
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          for archive in Path(".").rglob("*.zip"):
              if ".git" in archive.parts:
                  continue

              target = archive.parent.resolve()

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      name = item.filename.replace("\\", "/")
                      parts = Path(name).parts

                      if name.startswith("/") or ".." in parts:
                          raise ValueError(f"Unsafe ZIP path: {name}")

                      if not name:
                          continue

                      destination = (target / name).resolve()
                      if destination != target and target not in destination.parents:
                          raise ValueError(f"Unsafe ZIP path: {name}")

                      z.extract(item, target)

              print(f"Extracted {archive} into {target}")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract ZIP files in place"
            git push
          fi
          
